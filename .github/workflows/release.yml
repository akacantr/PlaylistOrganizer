name: Release Builds

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux Release Bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev pkg-config file
          sudo apt-get install -y libfuse2t64 || sudo apt-get install -y libfuse2 || true

      - name: Build Native Release Binary with Cargo
        run: |
          cargo build --release

      - name: Package Linux Distribution
        run: |
          TAG="${{ github.ref_type == 'tag' && github.ref_name || inputs.tag_name || 'v1.0.0' }}"
          PKG_NAME="PlaylistOrganizer-${TAG}-linux-x86_64"
          mkdir -p "pkg_staging/${PKG_NAME}"
          cp target/release/playlist-organizer "pkg_staging/${PKG_NAME}/"
          cp run.py start.sh playlist-organizer.desktop playlist-organizer.service install-desktop.sh README.md LICENSE .env.example logo.svg requirements.txt "pkg_staging/${PKG_NAME}/"
          chmod +x "pkg_staging/${PKG_NAME}/playlist-organizer" "pkg_staging/${PKG_NAME}/start.sh" "pkg_staging/${PKG_NAME}/install-desktop.sh"
          
          cd pkg_staging
          tar -czvf "../${PKG_NAME}.tar.gz" "${PKG_NAME}"
          cd ..
          sha256sum "${PKG_NAME}.tar.gz" > "${PKG_NAME}.tar.gz.sha256"

      - name: Build Linux AppImage
        run: |
          TAG="${{ github.ref_type == 'tag' && github.ref_name || inputs.tag_name || 'v1.0.0' }}"
          APPIMAGE_NAME="PlaylistOrganizer-${TAG}-linux-x86_64.AppImage"
          APPDIR="pkg_staging/AppDir"
          rm -rf "${APPDIR}"
          mkdir -p "${APPDIR}/usr/bin"
          mkdir -p "${APPDIR}/usr/share/applications"
          mkdir -p "${APPDIR}/usr/share/icons/hicolor/scalable/apps"

          cp target/release/playlist-organizer "${APPDIR}/usr/bin/"
          cp README.md LICENSE .env.example logo.svg "${APPDIR}/usr/bin/"

          cp playlist-organizer.desktop "${APPDIR}/playlist-organizer.desktop"
          cp playlist-organizer.desktop "${APPDIR}/usr/share/applications/"
          cp logo.svg "${APPDIR}/playlist-organizer.svg"
          cp logo.svg "${APPDIR}/usr/share/icons/hicolor/scalable/apps/playlist-organizer.svg"
          cp scripts/AppRun "${APPDIR}/AppRun"
          chmod +x "${APPDIR}/AppRun" "${APPDIR}/usr/bin/playlist-organizer"

          curl -sL https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -o appimagetool
          chmod +x appimagetool
          ./appimagetool --appimage-extract
          ARCH=x86_64 ./squashfs-root/AppRun --no-appstream "${APPDIR}" "${APPIMAGE_NAME}"
          chmod +x "${APPIMAGE_NAME}"
          sha256sum "${APPIMAGE_NAME}" > "${APPIMAGE_NAME}.sha256"

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: |
            PlaylistOrganizer-*-linux-x86_64.tar.gz
            PlaylistOrganizer-*-linux-x86_64.tar.gz.sha256
            PlaylistOrganizer-*-linux-x86_64.AppImage
            PlaylistOrganizer-*-linux-x86_64.AppImage.sha256

  build-windows:
    name: Build Windows Release Bundle
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build Native Release Binary with Cargo
        run: |
          cargo build --release

      - name: Package Windows Distribution
        shell: pwsh
        run: |
          $tag = if ('${{ github.ref_type }}' -eq 'tag') { '${{ github.ref_name }}' } else { '${{ inputs.tag_name }}' }
          if (-not $tag) { $tag = "v1.0.0" }
          $pkgName = "PlaylistOrganizer-$tag-windows-x64"
          $exeName = "$pkgName.exe"

          # 1. Standalone single-file executable (.exe)
          Copy-Item -Path "target\release\playlist-organizer.exe" -Destination "$exeName"
          $exeHash = (Get-FileHash "$exeName" -Algorithm SHA256).Hash.ToLower()
          "$exeHash  $exeName`n" | Out-File -FilePath "$exeName.sha256" -Encoding ascii -NoNewline

          # 2. Package directory into zip
          New-Item -ItemType Directory -Path "pkg_staging\$pkgName" -Force | Out-Null
          Copy-Item -Path "target\release\playlist-organizer.exe" -Destination "pkg_staging\$pkgName\PlaylistOrganizer.exe"
          Copy-Item -Path "start.bat", "README.md", "LICENSE", ".env.example", "logo.svg" -Destination "pkg_staging\$pkgName"
          Compress-Archive -Path "pkg_staging\$pkgName" -DestinationPath "$pkgName.zip"
          $zipHash = (Get-FileHash "$pkgName.zip" -Algorithm SHA256).Hash.ToLower()
          "$zipHash  $pkgName.zip`n" | Out-File -FilePath "$pkgName.zip.sha256" -Encoding ascii -NoNewline

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            PlaylistOrganizer-*-windows-x64.exe
            PlaylistOrganizer-*-windows-x64.exe.sha256
            PlaylistOrganizer-*-windows-x64.zip
            PlaylistOrganizer-*-windows-x64.zip.sha256

  publish-release:
    name: Publish GitHub Release
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_artifacts
          merge-multiple: true

      - name: Determine Tag
        id: vars
        run: |
          TAG="${{ github.ref_type == 'tag' && github.ref_name || inputs.tag_name || 'v1.0.0' }}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Generate Unified SHA256SUMS
        run: |
          cd release_artifacts
          shopt -s nullglob
          files=(*.tar.gz *.zip *.AppImage *.exe)
          if [ ${#files[@]} -gt 0 ]; then
            sha256sum "${files[@]}" > SHA256SUMS.txt
          else
            echo "No release binaries found" > SHA256SUMS.txt
          fi
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: PlaylistOrganizer ${{ steps.vars.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release_artifacts/*.tar.gz
            release_artifacts/*.zip
            release_artifacts/*.AppImage
            release_artifacts/*.exe
            release_artifacts/*.sha256
            release_artifacts/SHA256SUMS.txt
