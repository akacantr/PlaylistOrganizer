[package]
name = "playlist-organizer"
version = "1.0.0"
edition = "2021"
authors = ["akacantr"]
description = "Spotify Playlist Genre Organizer desktop application"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui_extras = { version = "0.29", features = ["all_loaders"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
rodio = { version = "0.19", default-features = false, features = ["symphonia-mp3"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "sync", "time"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.10"
open = "5.3"
dotenvy = "0.15"
dirs = "5.0"
url = "2.5"
tiny_http = "0.12"
lazy_static = "1.5"
