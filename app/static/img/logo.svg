<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161819" />
      <stop offset="50%" stop-color="#0f1112" />
      <stop offset="100%" stop-color="#070809" />
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1ed760" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#1db954" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.25" />
    </linearGradient>

    <linearGradient id="primaryGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22e569" />
      <stop offset="60%" stop-color="#1db954" />
      <stop offset="100%" stop-color="#149c44" />
    </linearGradient>

    <linearGradient id="forkGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#1ed760" />
      <stop offset="100%" stop-color="#38ef7d" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <radialGradient id="ambientGlow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#1db954" stop-opacity="0.18" />
      <stop offset="70%" stop-color="#1db954" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <filter id="noteShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6" />
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#1db954" flood-opacity="0.3" />
    </filter>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="116" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="4" />
  
  <circle cx="256" cy="240" r="210" fill="url(#ambientGlow)" />

  <path d="M 60 256 Q 160 220 256 256 T 452 256" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="8" stroke-linecap="round" />
  <path d="M 90 286 Q 180 256 256 286 T 422 286" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="6" stroke-linecap="round" />

  <g filter="url(#noteShadow)">
    <ellipse cx="362" cy="292" rx="46" ry="34" transform="rotate(-26 362 292)" fill="url(#primaryGreen)" />
    <ellipse cx="232" cy="336" rx="46" ry="34" transform="rotate(-26 232 336)" fill="url(#primaryGreen)" />
    <rect x="256" y="152" width="22" height="184" rx="11" fill="url(#primaryGreen)" />
    <rect x="386" y="108" width="22" height="184" rx="11" fill="url(#primaryGreen)" />
    <polygon points="256,152 408,108 408,154 256,198" fill="url(#primaryGreen)" />
    <polygon points="256,152 408,108 408,122 256,166" fill="#ffffff" fill-opacity="0.32" />
    <ellipse cx="230" cy="328" rx="24" ry="12" transform="rotate(-30 230 328)" fill="#ffffff" fill-opacity="0.28" />
    <ellipse cx="360" cy="284" rx="24" ry="12" transform="rotate(-30 360 284)" fill="#ffffff" fill-opacity="0.28" />
  </g>

  <g filter="url(#glow)">
    <circle cx="128" cy="384" r="66" fill="#141718" stroke="#1ed760" stroke-opacity="0.35" stroke-width="3.5" />
    <circle cx="128" cy="384" r="54" fill="#1db954" fill-opacity="0.08" />
    <path d="M 128 424 L 128 392" stroke="url(#forkGrad)" stroke-width="10" stroke-linecap="round" />
    <path d="M 128 392 C 128 372, 102 368, 102 350" fill="none" stroke="url(#forkGrad)" stroke-width="9" stroke-linecap="round" />
    <circle cx="102" cy="346" r="8" fill="#ffffff" stroke="#1ed760" stroke-width="3" />
    <path d="M 128 392 C 128 372, 154 368, 154 350" fill="none" stroke="url(#forkGrad)" stroke-width="9" stroke-linecap="round" />
    <circle cx="154" cy="346" r="8" fill="#ffffff" stroke="#1ed760" stroke-width="3" />
    <circle cx="128" cy="426" r="6" fill="#1ed760" />
    <path d="M 172 356 C 188 344, 198 340, 206 338" fill="none" stroke="url(#forkGrad)" stroke-width="3" stroke-dasharray="4 5" stroke-opacity="0.6" stroke-linecap="round" />
  </g>
</svg>
